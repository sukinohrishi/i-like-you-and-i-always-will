<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Like You • 60 Languages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ff6b9d;
      --deep: #ff2d6f;
      --soft: #ffb6c1;
      --cream: #fff5f7;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #090008;
      font-family: 'Quicksand', sans-serif;
    }

    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 25% 15%, rgba(255, 45, 111, 0.15) 0%, transparent 45%),
        radial-gradient(ellipse at 75% 85%, rgba(255, 107, 157, 0.12) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 50%, rgba(55, 0, 32, 0.5) 0%, transparent 65%),
        linear-gradient(165deg, #10000c 0%, #160012 50%, #0a0008 100%);
      z-index: 0;
    }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .decor {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      color: var(--pink);
      opacity: 0.18;
      animation: floatHeart 15s ease-in-out infinite;
      filter: drop-shadow(0 0 6px rgba(255,107,157,0.45));
      font-size: 1.05rem;
    }

    .petal {
      position: absolute;
      width: 13px;
      height: 9px;
      background: linear-gradient(135deg, #ff8fab, #ff2d6f);
      border-radius: 50% 0 50% 50%;
      opacity: 0.28;
      animation: fallPetal 19s linear infinite;
    }

    .sparkle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px 1px rgba(255, 215, 180, 0.85);
      animation: twinkle 2.8s ease-in-out infinite;
    }

    .container {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 4.2vw, 2.55rem);
      font-weight: 400;
      color: var(--cream);
      letter-spacing: 0.06em;
      text-align: center;
      margin-bottom: 0.35rem;
      opacity: 0;
      animation: fadeUp 1.1s 0.15s cubic-bezier(0.22,1,0.36,1) forwards;
      text-shadow: 0 0 28px rgba(255,107,157,0.4);
    }
    .title span {
      color: var(--pink);
      font-style: italic;
    }

    .subtitle {
      font-size: 0.78rem;
      color: rgba(255,182,193,0.6);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.6rem;
      opacity: 0;
      animation: fadeUp 1.1s 0.35s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .start-btn {
      position: relative;
      z-index: 20;
      margin-bottom: 1.8rem;
      padding: 14px 36px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #fff;
      background: linear-gradient(135deg, #ff4d7a, #ff2d6f);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow:
        0 0 0 0 rgba(255, 45, 111, 0.5),
        0 8px 25px rgba(255, 45, 111, 0.35);
      transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
      opacity: 0;
      animation: fadeUp 1.1s 0.55s cubic-bezier(0.22,1,0.36,1) forwards;
      overflow: hidden;
    }

    .start-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .start-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow:
        0 0 0 6px rgba(255, 45, 111, 0.18),
        0 12px 32px rgba(255, 45, 111, 0.45);
    }
    .start-btn:hover::before { opacity: 1; }

    .start-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .start-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.9);
      transition: all 0.5s ease;
    }

    .heart-stage {
      position: relative;
      width: min(94vw, 700px);
      height: min(70vw, 470px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .heart-glow {
      position: absolute;
      width: 62%;
      height: 62%;
      background: radial-gradient(ellipse at center, rgba(255,45,111,0.1) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0;
      transition: opacity 1.5s ease;
      z-index: -1;
    }
    .heart-glow.active {
      opacity: 1;
      animation: pulseGlow 5s ease-in-out infinite;
    }

    .phrase {
      position: absolute;
      font-family: 'Quicksand', sans-serif;
      font-weight: 500;
      color: #ff4d7a;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.3);
      text-shadow:
        0 0 10px rgba(255,45,111,0.6),
        0 0 18px rgba(255,45,111,0.25);
      transition: color 0.3s ease, text-shadow 0.3s ease;
      cursor: default;
      pointer-events: none;
    }

    .phrase.visible {
      animation: phraseFadeIn 0.9s cubic-bezier(0.22,1,0.36,1) forwards;
      pointer-events: auto;
    }

    .phrase:hover {
      color: #fff !important;
      text-shadow:
        0 0 14px rgba(255,255,255,0.95),
        0 0 30px rgba(255,107,157,0.8) !important;
      z-index: 30;
    }

    .phrase.xs { font-size: clamp(0.5rem, 1.25vw, 0.68rem); }
    .phrase.s  { font-size: clamp(0.55rem, 1.4vw, 0.76rem); }
    .phrase.m  { font-size: clamp(0.62rem, 1.55vw, 0.86rem); }
    .phrase.l  { font-size: clamp(0.72rem, 1.75vw, 0.98rem); font-weight: 600; }

    .footer-msg {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: rgba(255,182,193,0.45);
      letter-spacing: 0.14em;
      opacity: 0;
      transition: opacity 1s ease 0.8s;
    }
    .footer-msg.show {
      opacity: 1;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes phraseFadeIn {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3) translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) translateY(0);
      }
    }

    @keyframes gentleFloat {
      0%,100% { transform: translate(-50%, -50%) translateY(0); }
      50%     { transform: translate(-50%, -50%) translateY(-4px); }
    }

    .phrase.floating {
      animation: phraseFadeIn 0.9s cubic-bezier(0.22,1,0.36,1) forwards,
                 gentleFloat 8s ease-in-out infinite;
    }

    @keyframes floatHeart {
      0%,100% { transform: translateY(0) rotate(0deg) scale(1); }
      30%     { transform: translateY(-20px) rotate(5deg) scale(1.07); }
      60%     { transform: translateY(-7px) rotate(-4deg) scale(0.96); }
    }

    @keyframes fallPetal {
      0%   { transform: translateY(-8vh) rotate(0deg); opacity: 0; }
      12%  { opacity: 0.32; }
      90%  { opacity: 0.22; }
      100% { transform: translateY(108vh) rotate(400deg) translateX(25px); opacity: 0; }
    }

    @keyframes twinkle {
      0%,100% { opacity: 0.12; transform: scale(0.5); }
      50%     { opacity: 1; transform: scale(1.35); }
    }

    @keyframes pulseGlow {
      0%,100% { opacity: 0.5; transform: scale(1); }
      50%     { opacity: 0.9; transform: scale(1.05); }
    }

    @media (max-width: 520px) {
      .start-btn { padding: 12px 28px; font-size: 0.88rem; }
      .subtitle { margin-bottom: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <canvas id="particles"></canvas>
  <div class="decor" id="decor"></div>

  <!-- Background music (Massive Attack - Angel) -->
  <audio id="bgMusic" loop preload="auto">
    <source src="angel.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <h1 class="title">I <span>Like</span> You</h1>
    <p class="subtitle">in sixty languages</p>

    <button class="start-btn" id="startBtn">Click here ♡</button>

    <div class="heart-stage" id="heartStage">
      <div class="heart-glow" id="heartGlow"></div>
    </div>

    <p class="footer-msg" id="footerMsg">made with ♡ for you</p>
  </div>

  <script>
    const phrases = [
      { t: "I like you", s: "l" },
      { t: "Me gustas", s: "m" },
      { t: "Je t'aime bien", s: "m" },
      { t: "Ich mag dich", s: "m" },
      { t: "Mi piaci", s: "m" },
      { t: "Gosto de você", s: "m" },
      { t: "Ik vind je leuk", s: "s" },
      { t: "Ты мне нравишься", s: "s" },
      { t: "Ти мені подобаєшся", s: "s" },
      { t: "Lubię cię", s: "m" },
      { t: "Líbíš se mi", s: "s" },
      { t: "Páčiš sa mi", s: "s" },
      { t: "Kedvellek", s: "s" },
      { t: "Îmi placi", s: "s" },
      { t: "Харесвам те", s: "s" },
      { t: "Sviđaš mi se", s: "s" },
      { t: "Všeč si mi", s: "s" },
      { t: "Jag gillar dig", s: "s" },
      { t: "Jeg liker deg", s: "s" },
      { t: "Jeg kan lide dig", s: "s" },
      { t: "Pidän sinusta", s: "s" },
      { t: "Μου αρέσεις", s: "s" },
      { t: "Senden hoşlanıyorum", s: "s" },
      { t: "أنا معجب بك", s: "s" },
      { t: "我喜欢你", s: "m" },
      { t: "好きです", s: "m" },
      { t: "좋아해요", s: "m" },
      { t: "मुझे तुम पसंद हो", s: "s" },
      { t: "আমি তোমাকে পছন্দ করি", s: "xs" },
      { t: "Aku suka kamu", s: "s" },
      { t: "ฉันชอบคุณ", s: "s" },
      { t: "Tôi thích bạn", s: "s" },
      { t: "Gusto kita", s: "s" },
      { t: "Nakupenda", s: "s" },
      { t: "Ek hou van jou", s: "s" },
      { t: "Tu me plais", s: "s" },
      { t: "Eu gosto de ti", s: "s" },
      { t: "Mám ťa rád", s: "s" },
      { t: "Tetszel", s: "s" },
      { t: "Мне нравишься", s: "s" },
      { t: "Je t'apprécie", s: "s" },
      { t: "Du gefällst mir", s: "s" },
      { t: "Mi piaci tanto", s: "s" },
      { t: "Ik mag je", s: "s" },
      { t: "Me caes bien", s: "s" },
      { t: "Sa meeldid mulle", s: "s" },
      { t: "Tu man patīc", s: "s" },
      { t: "Tu man patinki", s: "s" },
      { t: "Mér líkar við þig", s: "xs" },
      { t: "Is maith liom thú", s: "s" },
      { t: "Gustatzen zaitut", s: "xs" },
      { t: "M'agrades", s: "s" },
      { t: "Haresvam te", s: "s" },
      { t: "Wo xihuan ni", s: "s" },
      { t: "Suki desu", s: "s" },
      { t: "Joahaeyo", s: "s" },
      { t: "Mujhe tum pasand ho", s: "xs" },
      { t: "Te gusto", s: "s" },
      { t: "Du bist nett", s: "s" },
      { t: "You are nice", s: "s" }
    ];

    function heartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      return { x: x * scale, y: y * scale };
    }

    function generatePositions(n) {
      const pts = [];
      const outlineCount = Math.floor(n * 0.82);
      for (let i = 0; i < outlineCount; i++) {
        const t = (i / outlineCount) * Math.PI * 2 + 0.12;
        const p = heartPoint(t, 11.4);
        pts.push({ x: p.x, y: p.y });
      }
      const innerCount = n - outlineCount;
      for (let i = 0; i < innerCount; i++) {
        const t = (i / innerCount) * Math.PI * 2 + 0.6;
        const r = 0.38 + (i % 4) * 0.11;
        const p = heartPoint(t, 11.4 * r);
        pts.push({ x: p.x, y: p.y });
      }
      return pts;
    }

    function reduceOverlaps(pts, minDist = 34) {
      for (let iter = 0; iter < 6; iter++) {
        for (let i = 0; i < pts.length; i++) {
          for (let j = i + 1; j < pts.length; j++) {
            const dx = pts[j].x - pts[i].x;
            const dy = pts[j].y - pts[i].y;
            const dist = Math.sqrt(dx*dx + dy*dy) || 0.01;
            if (dist < minDist) {
              const push = (minDist - dist) * 0.42;
              const nx = dx / dist;
              const ny = dy / dist;
              pts[i].x -= nx * push;
              pts[i].y -= ny * push;
              pts[j].x += nx * push;
              pts[j].y += ny * push;
            }
          }
        }
      }
      return pts;
    }

    const stage = document.getElementById('heartStage');
    const positions = reduceOverlaps(generatePositions(phrases.length), 36);

    const phraseEls = [];
    phrases.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = `phrase ${p.s}`;
      el.textContent = p.t;
      el.style.left = `calc(50% + ${positions[i].x}px)`;
      el.style.top  = `calc(50% + ${positions[i].y}px)`;
      stage.appendChild(el);
      phraseEls.push(el);
    });

    const startBtn = document.getElementById('startBtn');
    const heartGlow = document.getElementById('heartGlow');
    const footerMsg = document.getElementById('footerMsg');

    startBtn.addEventListener('click', () => {
      startBtn.classList.add('hidden');
      heartGlow.classList.add('active');

      // Start the music smoothly
      const music = document.getElementById('bgMusic');
      music.volume = 0.7;
      music.play().catch(() => {});

      phraseEls.forEach((el, i) => {
        setTimeout(() => {
          el.classList.add('visible');
          setTimeout(() => {
            el.classList.add('floating');
          }, 950);
        }, i * 55);
      });

      setTimeout(() => {
        footerMsg.classList.add('show');
      }, phraseEls.length * 55 + 600);
    });

    // Try autoplay on load (may be blocked by browser)
    window.addEventListener('load', () => {
      const music = document.getElementById('bgMusic');
      music.volume = 0.7;
      music.play().catch(() => {});
    });

    const decor = document.getElementById('decor');
    const hearts = ['♡','♥','❤','💗'];

    for (let i = 0; i < 11; i++) {
      const h = document.createElement('div');
      h.className = 'floating-heart';
      h.textContent = hearts[i % hearts.length];
      h.style.left = `${4 + Math.random()*92}%`;
      h.style.top  = `${4 + Math.random()*92}%`;
      h.style.fontSize = `${0.8 + Math.random()*1.0}rem`;
      h.style.animationDuration = `${12 + Math.random()*8}s`;
      h.style.animationDelay = `${Math.random()*6}s`;
      h.style.opacity = 0.1 + Math.random()*0.15;
      decor.appendChild(h);
    }

    for (let i = 0; i < 7; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.style.left = `${Math.random()*100}%`;
      petal.style.animationDuration = `${15 + Math.random()*10}s`;
      petal.style.animationDelay = `${Math.random()*8}s`;
      decor.appendChild(petal);
    }

    for (let i = 0; i < 14; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = `${Math.random()*100}%`;
      s.style.top  = `${Math.random()*100}%`;
      s.style.animationDuration = `${2.3 + Math.random()*2.4}s`;
      s.style.animationDelay = `${Math.random()*3.5}s`;
      decor.appendChild(s);
    }

    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let w, h, particles = [];

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() { this.reset(true); }
      reset(init) {
        this.x = Math.random() * w;
        this.y = init ? Math.random() * h : h + 10;
        this.size = Math.random() * 1.7 + 0.4;
        this.speedY = Math.random() * 0.25 + 0.05;
        this.speedX = (Math.random() - 0.5) * 0.18;
        this.opacity = Math.random() * 0.28 + 0.07;
        this.hue = 335 + Math.random() * 25;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -12 || this.x < -12 || this.x > w + 12) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 75%, 72%, ${this.opacity})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < 45; i++) particles.push(new Particle());

    function loop() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
